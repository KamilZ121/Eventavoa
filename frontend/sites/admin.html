<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Administration – Eventavoa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/eventavoa/frontend/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
<div id="header"></div>
<main class="container my-5 flex-grow-1">
    <h1 class="mb-4">Administration</h1>
    <div id="adminMessage" class="alert d-none"></div>
    <ul class="nav nav-tabs mb-4">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#products">Produkte</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#customers">Kunden</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#vouchers">Gutscheine</button></li>
    </ul>
    <div class="tab-content">
        <section class="tab-pane fade show active" id="products">
            <form id="productForm" class="card card-body mb-4" enctype="multipart/form-data">
                <input type="hidden" name="action" value="saveProduct"><input type="hidden" name="id" id="productId">
                <div class="row g-3">
                    <div class="col-md-3"><label class="form-label">Kategorie</label><select class="form-select" name="category_id" id="productCategory" required></select></div>
                    <div class="col-md-5"><label class="form-label">Name</label><input class="form-control" name="name" id="productName" required></div>
                    <div class="col-md-2"><label class="form-label">Preis</label><input class="form-control" type="number" min="0" step=".01" name="price" id="productPrice" required></div>
                    <div class="col-md-2"><label class="form-label">Bewertung</label><input class="form-control" type="number" min="0" max="5" step=".1" name="rating" id="productRating" required></div>
                    <div class="col-md-8"><label class="form-label">Beschreibung</label><textarea class="form-control" name="description" id="productDescription" required></textarea></div>
                    <div class="col-md-4"><label class="form-label">Produktfoto</label><input class="form-control" type="file" accept="image/jpeg,image/png,image/webp" name="image"></div>
                </div>
                <div class="mt-3"><button class="btn btn-primary">Speichern</button> <button type="button" id="resetProduct" class="btn btn-outline-secondary">Neu</button></div>
            </form>
            <div id="adminProducts"></div>
        </section>
        <section class="tab-pane fade" id="customers"><div id="adminCustomers"></div><div id="customerOrders" class="mt-4"></div></section>
        <section class="tab-pane fade" id="vouchers">
            <form id="voucherForm" class="card card-body mb-4"><div class="row g-3 align-items-end">
                <div class="col-md-4"><label class="form-label">Geldwert</label><input class="form-control" name="value" type="number" min=".01" step=".01" required></div>
                <div class="col-md-4"><label class="form-label">Gültig bis</label><input class="form-control" name="expires_at" type="date" required></div>
                <div class="col-md-4"><button class="btn btn-primary">Gutschein erstellen</button></div>
            </div></form>
            <div id="adminVouchers"></div>
        </section>
    </div>
</main>
<div id="footer"></div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/eventavoa/frontend/js/admin.js"></script>
</body></html>
