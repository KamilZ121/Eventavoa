<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechnung - Eventavoa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<div id="invoice" class="container" style="max-width: 700px;">
    <p>Rechnung wird geladen...</p>
</div>

<script>
    const ORDER_URL = "/eventavoa/backend/logic/orderHandler.php";
    const orderId = new URLSearchParams(window.location.search).get("order");

    fetch(ORDER_URL + "?action=getInvoice&order_id=" + encodeURIComponent(orderId), { cache: "no-store" })
        .then(r => r.json())
        .then(res => {
            if (!res.success) {
                document.getElementById("invoice").innerHTML =
                    '<div class="alert alert-danger">Rechnung nicht verfügbar.</div>';
                return;
            }

            const o = res.order;
            const k = res.kunde || {};
            const a = res.adresse || {};
            // "2026-06-20 ..." -> "20. 06. 2026"
            const datum = o.created_at.substring(0, 10).split("-").reverse().join(". ");
            const jahr = o.created_at.substring(0, 4);
            // Rechnungsnummer (RE + Datum)
            const reNr = "RE-" + jahr + "-" + String(o.id).padStart(4, "0");

            let rows = "";
            res.items.forEach(it => {
                rows += `
                    <tr>
                        <td>${it.name}</td>
                        <td class="text-end">${it.menge}</td>
                        <td class="text-end">${it.einzelpreis.toFixed(2)} €</td>
                        <td class="text-end">${(it.menge * it.einzelpreis).toFixed(2)} €</td>
                    </tr>`;
            });

            document.getElementById("invoice").innerHTML = `
                <div class="d-flex justify-content-between align-items-start">
                    <h2 class="fw-bold text-primary">Eventavoa</h2>
                    <div class="text-end">
                        <h4 class="mb-1">Rechnung</h4>
                        <div>Nr. ${reNr}</div>
                        <div>Datum: ${datum}</div>
                    </div>
                </div>
                <hr>
                <p class="mb-4">
                    <strong>Rechnungsadresse:</strong><br>
                    ${k.anrede ? k.anrede + " " : ""}${k.vorname || ""} ${k.nachname || ""}<br>
                    ${a.strasse || ""}<br>
                    ${a.plz || ""} ${a.ort || ""}
                </p>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Produkt</th>
                            <th class="text-end">Menge</th>
                            <th class="text-end">Einzelpreis</th>
                            <th class="text-end">Summe</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                    <tfoot>
                        <tr>
                            <th colspan="3" class="text-end">Gesamt</th>
                            <th class="text-end">${o.gesamt.toFixed(2)} €</th>
                        </tr>
                    </tfoot>
                </table>
                <button class="btn btn-primary mt-3 d-print-none" onclick="window.print()">Drucken</button>`;
        });
</script>

</body>
</html>
