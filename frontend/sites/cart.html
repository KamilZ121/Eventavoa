<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventavoa - Warenkorb</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/eventavoa/frontend/css/style.css">
</head>
<body class="d-flex flex-column" style="min-height: 100vh;">

<div id="header"></div>

<main class="container my-5 flex-grow-1">
    <h2 class="mb-4">Warenkorb</h2>

    <!-- Inhalt wird per AJAX aus cart.js befüllt -->
    <div id="cartContent">
        <div class="alert alert-info">Warenkorb wird geladen...</div>
    </div>
</main>

<div id="footer"></div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $(document).ready(function() {
        // Header laden, danach Counter aktualisieren
        $("#header").load("/eventavoa/frontend/sites/header.html", function () {
            updateCartBadge();
        });
        $("#footer").load("/eventavoa/frontend/sites/footer.html");
    });
</script>

<script src="/eventavoa/frontend/js/cart.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
