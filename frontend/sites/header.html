<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top site-header">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/eventavoa/index.html">Eventavoa</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Navigation öffnen">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/eventavoa/index.html">Home</a></li>
                <li class="nav-item" id="navProdukte"><a class="nav-link" href="/eventavoa/index.html#products">Produkte</a></li>
                <li class="nav-item admin-only d-none"><a class="nav-link" href="/eventavoa/frontend/sites/admin.html">Adminbereich</a></li>
                <li class="nav-item position-relative" id="cartWidget">
                    <a class="nav-link d-flex align-items-center gap-1" id="cartLink" href="/eventavoa/frontend/sites/cart.html"><span aria-hidden="true">&#128722;</span> Warenkorb <span id="cartCount" class="badge bg-primary">0</span></a>
                    <div id="miniCart" class="shadow rounded bg-white text-dark p-3 position-absolute end-0 d-none" style="min-width:280px;z-index:1050">
                        <div id="miniCartContent"></div>
                    </div>
                </li>
                <li class="nav-item d-none" id="navKonto"><a class="nav-link" href="/eventavoa/frontend/sites/konto.html">Mein Konto</a></li>
            </ul>
            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item" id="navLogin"><a class="nav-link" href="/eventavoa/frontend/sites/login.html">Login</a></li>
                <li class="nav-item d-none" id="navLogout"><span class="navbar-text me-2" id="navGreeting"></span><button class="btn btn-sm btn-secondary" id="logoutBtn">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<div class="modal fade" id="welcomeModal" tabindex="-1" aria-labelledby="welcomeModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg border-0">
            <div class="modal-header border-0 pb-0">
                <h1 class="modal-title display-6" id="welcomeModalTitle">Willkommen!</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Schließen"></button>
            </div>
            <div class="modal-body pt-3 pb-4">
                <p class="mb-4">Sie sind eingeloggt<span id="welcomeUser"></span>.</p>
                <button type="button" class="btn btn-link p-0" id="welcomeLogoutBtn">Logout!</button>
            </div>
        </div>
    </div>
</div>

<script>
$(function () {
    const cartUrl = "/eventavoa/backend/logic/cartHandler.php";
    const authUrl = "/eventavoa/backend/logic/authHandler.php";

    $.ajax({url: authUrl, dataType: "json", cache: false, data: {method: "status"}}).done(function (status) {
        if (!status.loggedIn) return;
        $("#navLogin").addClass("d-none");
        $("#navLogout").removeClass("d-none");
        $("#navGreeting").text("Hallo, " + status.benutzername);
        if (status.rolle === "admin") {
            $(".admin-only").removeClass("d-none");
            $("#navProdukte, #cartWidget").addClass("d-none");
        } else {
            $("#navKonto").removeClass("d-none");
        }
        showWelcomeModal(status);
    });

    $("#logoutBtn, #welcomeLogoutBtn").on("click", function () {
        sessionStorage.removeItem("eventavoaWelcomeShownFor");
        sessionStorage.removeItem("eventavoaShowWelcome");
        $.ajax({url: authUrl, method: "POST", dataType: "json", data: {method: "logout"}})
            .always(function () { window.location.href = "/eventavoa/index.html"; });
    });

    $("#cartWidget").on("mouseenter", function () {
        $.ajax({url: cartUrl, dataType: "json", data: {method: "getCart"}}).done(function (cart) {
            let html = cart.items.length ? cart.items.map(item =>
                `<div class="d-flex justify-content-between mb-2"><span>${item.qty}× ${escapeHtml(item.name)}</span><span>${item.line_total.toFixed(2)} €</span></div>`
            ).join("") + `<hr><strong>Gesamt: ${cart.total.toFixed(2)} €</strong>` : '<p class="mb-0 text-muted">Ihr Warenkorb ist leer.</p>';
            $("#miniCartContent").html(html);
            $("#miniCart").removeClass("d-none");
        });
    }).on("mouseleave", function () { $("#miniCart").addClass("d-none"); });
});

function showWelcomeModal(status) {
    if (typeof bootstrap === "undefined" || !$("#welcomeModal").length) return;

    const userKey = status.benutzername || "user";
    const forceShow = sessionStorage.getItem("eventavoaShowWelcome") === "1";
    const alreadyShownFor = sessionStorage.getItem("eventavoaWelcomeShownFor") === userKey;

    if (!forceShow && alreadyShownFor) return;

    $("#welcomeUser").text(status.benutzername ? ", " + status.benutzername : "");
    sessionStorage.setItem("eventavoaWelcomeShownFor", userKey);
    sessionStorage.removeItem("eventavoaShowWelcome");

    bootstrap.Modal.getOrCreateInstance(document.getElementById("welcomeModal")).show();
}

function escapeHtml(value) {
    return $("<div>").text(value == null ? "" : String(value)).html();
}
</script>
