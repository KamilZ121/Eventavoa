<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/eventavoa/index.html">Eventavoa</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-label="Navigation öffnen">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="/eventavoa/index.html">Home</a></li>
                <li class="nav-item" id="navProdukte"><a class="nav-link" href="/eventavoa/index.html#products">Produkte</a></li>
                <li class="nav-item admin-only d-none"><a class="nav-link" href="/eventavoa/frontend/sites/admin.html#products">Produkte bearbeiten</a></li>
                <li class="nav-item admin-only d-none"><a class="nav-link" href="/eventavoa/frontend/sites/admin.html#customers">Kunden bearbeiten</a></li>
                <li class="nav-item admin-only d-none"><a class="nav-link" href="/eventavoa/frontend/sites/admin.html#vouchers">Gutscheine verwalten</a></li>
                <li class="nav-item position-relative" id="cartWidget">
                    <a class="nav-link" id="cartLink" href="/eventavoa/frontend/sites/cart.html">Warenkorb <span id="cartCount" class="badge bg-primary">0</span></a>
                    <div id="miniCart" class="shadow rounded bg-white text-dark p-3 position-absolute end-0 d-none" style="min-width:280px;z-index:1050">
                        <div id="miniCartContent"></div>
                    </div>
                </li>
                <li class="nav-item d-none" id="navKonto"><a class="nav-link" href="/eventavoa/frontend/sites/konto.html">Mein Konto</a></li>
            </ul>
            <ul class="navbar-nav align-items-lg-center">
                <li class="nav-item" id="navLogin"><a class="nav-link" href="/eventavoa/frontend/sites/login.html">Login</a></li>
                <li class="nav-item d-none" id="navLogout"><span class="navbar-text me-2" id="navGreeting"></span><button class="btn btn-sm btn-secondary" id="logoutBtn">Logout</button></li>
            </ul>
        </div>
    </div>
</nav>

<script>
$(function () {
    const cartUrl = "/eventavoa/backend/logic/cartHandler.php";
    const authUrl = "/eventavoa/backend/logic/authHandler.php";

    $.ajax({url: authUrl, dataType: "json", cache: false, data: {action: "status"}}).done(function (status) {
        if (!status.loggedIn) return;
        $("#navLogin").addClass("d-none");
        $("#navLogout").removeClass("d-none");
        $("#navGreeting").text("Hallo, " + status.benutzername);
        if (status.rolle === "admin") {
            $(".admin-only").removeClass("d-none");
            $("#navProdukte, #cartWidget").addClass("d-none");
        } else {
            $("#navKonto").removeClass("d-none");
        }
    });

    $("#logoutBtn").on("click", function () {
        $.ajax({url: authUrl, method: "POST", dataType: "json", data: {action: "logout"}})
            .always(function () { window.location.href = "/eventavoa/index.html"; });
    });

    $("#cartWidget").on("mouseenter", function () {
        $.ajax({url: cartUrl, dataType: "json", data: {action: "getCart"}}).done(function (cart) {
            let html = cart.items.length ? cart.items.map(item =>
                `<div class="d-flex justify-content-between mb-2"><span>${item.qty}× ${escapeHtml(item.name)}</span><span>${item.line_total.toFixed(2)} €</span></div>`
            ).join("") + `<hr><strong>Gesamt: ${cart.total.toFixed(2)} €</strong>` : '<p class="mb-0 text-muted">Ihr Warenkorb ist leer.</p>';
            $("#miniCartContent").html(html);
            $("#miniCart").removeClass("d-none");
        });
    }).on("mouseleave", function () { $("#miniCart").addClass("d-none"); });
});

function escapeHtml(value) {
    return $("<div>").text(value == null ? "" : String(value)).html();
}
</script>
