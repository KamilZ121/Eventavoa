<!-- Mini-Warenkorb -->
<script>
(function () {
    const CART_URL = "/eventavoa/backend/logic/cartHandler.php";
    const widget = document.getElementById("cartWidget");
    const panel = document.getElementById("miniCart");
    const content = document.getElementById("miniCartContent");

    if (!widget) {
        return;
    }

    // Warenkorb Inhalt holen und im Mini-Fenster anzeigen
    function loadMiniCart() {
        fetch(CART_URL + "?action=getCart")
            .then(r => r.json())
            .then(cart => {
                if (!cart.items || cart.items.length === 0) {
                    content.innerHTML = '<p class="text-muted mb-0">Ihr Warenkorb ist leer.</p>';
                    return;
                }

                let html = "";
                cart.items.forEach(item => {
                    html += `
                        <div class="d-flex justify-content-between mb-2">
                            <span>${item.qty}× ${item.name}</span>
                            <span class="ms-3">${item.line_total.toFixed(2)} €</span>
                        </div>`;
                });
                html += `
                    <hr class="my-2">
                    <div class="d-flex justify-content-between fw-bold mb-2">
                        <span>Gesamt</span>
                        <span>${cart.total.toFixed(2)} €</span>
                    </div>
                    <a href="/eventavoa/frontend/sites/cart.html" class="btn btn-primary btn-sm w-100">Zum Warenkorb</a>`;
                content.innerHTML = html;
            });
    }

    // Beim Hovern öffnen und Inhalt laden
    widget.addEventListener("mouseenter", function () {
        loadMiniCart();
        panel.style.display = "block";
    });
    widget.addEventListener("mouseleave", function () {
        panel.style.display = "none";
    });
})();
</script>

<!-- Login/Logout Anzeige -->
<script>
(function () {
    const AUTH_URL = "/eventavoa/backend/logic/authHandler.php";
    const navLogin = document.getElementById("navLogin");
    const navLogout = document.getElementById("navLogout");
    const logoutBtn = document.getElementById("logoutBtn");

    if (!navLogin) {
        return;
    }

    // prüfen ob der User eingeloggt isz
    fetch(AUTH_URL + "?action=status", { cache: "no-store" })
        .then(r => r.json())
        .then(status => {
            if (!status.loggedIn) {
                return; // Gast: Standardmenü (Home, Produkte, Warenkorb, Login)
            }

            navLogin.style.display = "none";
            navLogout.style.display = "block";
            document.getElementById("navGreeting").textContent = "Hallo, " + status.benutzername;

            if (status.rolle === "admin") {
                // Admin sieht nur die Verwaltungsbereiche
                document.getElementById("navProdukte").style.display = "none";
                document.getElementById("cartWidget").style.display = "none";
                document.getElementById("navAdminProdukte").style.display = "block";
                document.getElementById("navAdminKunden").style.display = "block";
                document.getElementById("navAdminGutscheine").style.display = "block";
            } else {
                // Eingeloggter User sieht zusätzlich "Mein Konto"
                document.getElementById("navKonto").style.display = "block";
            }
        });

    // Logout
    logoutBtn.addEventListener("click", function (e) {
        e.preventDefault();
        fetch(AUTH_URL + "?action=logout")
            .then(r => r.json())
            .then(function () {
                window.location.href = "/eventavoa/index.html";
            });
    });
})();
</script>
